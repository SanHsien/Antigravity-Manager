# Temporary, manual-only probe: run the WHOLE `cargo test --lib` suite once on the
# same runner/toolchain/cache as ci.yml (the Rust job) and keep the raw output, so the
# real list of failing tests is known before ci.yml is switched from ~30 hand-picked
# selectors to a single full run. Delete this file once ci.yml runs the full suite.
name: Full lib test probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-lib-test:
    name: Run whole cargo test --lib
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust setup
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri"

      - name: Ensure frontend dist directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (-not (Test-Path "dist/index.html")) { Set-Content -Path "dist/index.html" -Value "<html/>" }

      # Compile separately so a build failure is not confused with test failures.
      - name: Build lib test binary
        timeout-minutes: 45
        shell: bash
        run: |
          cd src-tauri
          cargo test --locked --lib --no-run

      # One cargo invocation per test module (explicit test names, --exact), each under its own
      # `timeout`. A hung or aborting test (stack overflow, endless loop) then costs one batch
      # instead of the rest of the suite, and the batch is named in batch-status.txt.
      - name: Run whole lib test suite
        timeout-minutes: 60
        shell: bash
        run: |
          out="$RUNNER_TEMP/probe"
          mkdir -p "$out"
          cd src-tauri
          # GitHub runs `bash -eo pipefail`: without this the first failing or timed-out batch
          # would abort the step before rc is read, taskkill runs or later batches start.
          set +e
          cargo test --locked --lib -- --list 2>/dev/null | sed -n 's/: test$//p' > "$out/all-tests.txt"
          [ -s "$out/all-tests.txt" ] || { echo "no tests listed"; exit 1; }
          echo "listed $(wc -l < "$out/all-tests.txt") tests"
          sed 's/::[^:]*$//' "$out/all-tests.txt" | sort -u > "$out/batches.txt"
          : > "$out/full-lib-test.log"
          : > "$out/batch-status.txt"
          overall=0
          while IFS= read -r mod; do
            awk -v m="$mod" '{ n = $0; sub(/::[^:]*$/, "", n); if (n == m) print $0 }' "$out/all-tests.txt" > "$out/batch-names.txt"
            split -l 60 -d "$out/batch-names.txt" "$out/batch-chunk-"
            for chunk in "$out"/batch-chunk-*; do
              mapfile -t names < "$chunk"
              echo "=== BATCH $mod (${#names[@]} tests)" | tee -a "$out/full-lib-test.log"
              timeout 480 cargo test --locked --lib --no-fail-fast -- --test-threads=1 --exact "${names[@]}" > "$out/batch.tmp" 2>&1
              rc=$?
              cat "$out/batch.tmp" | tee -a "$out/full-lib-test.log"
              if [ "$rc" -eq 124 ]; then
                echo "TIMEOUT $mod (first test in chunk: ${names[0]})" >> "$out/batch-status.txt"
                taskkill //F //FI "IMAGENAME eq antigravity_tools_lib-*" > /dev/null 2>&1 || true
                overall=1
              elif [ "$rc" -ne 0 ]; then
                echo "FAIL(rc=$rc) $mod" >> "$out/batch-status.txt"
                overall=1
              else
                echo "ok $mod" >> "$out/batch-status.txt"
              fi
            done
            rm -f "$out"/batch-chunk-*
          done < "$out/batches.txt"
          echo "overall: $overall" | tee "$out/exit-code.txt"
          exit "$overall"

      - name: Summarize failures
        if: ${{ always() }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/probe/full-lib-test.log"
          if [ -f "$log" ]; then
            grep -E '^test .* \.\.\. (FAILED|ignored)' "$log" | sort > "$RUNNER_TEMP/probe/failed-and-ignored.txt" || true
            grep -E '^test .* \.\.\. FAILED' "$log" | sort > "$RUNNER_TEMP/probe/failed.txt" || true
            grep -E '^test result:' "$log" | awk '{p+=$4; f+=$6; i+=$8} END {print "passed=" p " failed=" f " ignored=" i}' > "$RUNNER_TEMP/probe/result.txt" || true
            {
              echo '## Full lib test probe'
              echo
              cat "$RUNNER_TEMP/probe/result.txt" 2>/dev/null
              echo
              echo '### FAILED'
              echo '```'
              cat "$RUNNER_TEMP/probe/failed.txt" 2>/dev/null
              echo '```'
              echo '### TIMEOUT / non-zero batches'
              echo '```'
              grep -v '^ok ' "$RUNNER_TEMP/probe/batch-status.txt" 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No test log was produced (build or earlier step failed).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-lib-test-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: warn
          retention-days: 14
