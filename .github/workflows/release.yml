name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v4.7.14-beta.1 on beta branch, or v4.7.14 on main branch). Leave empty to auto-detect from package.json.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-target:
    name: Verify Branch & Release Type Compatibility
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
      release_type: ${{ steps.gate.outputs.release_type }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and Validate Tag and Branch Alignment
        id: gate
        shell: bash
        run: |
          set -e

          # 1. 确定本次发布的 Tag 名称
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            echo "Using manual input tag: $TAG_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using git push tag: $TAG_NAME"
          else
            # 未提供 tag 且非 tag push (例如在分支上手动触发)，从 package.json 获取版本号
            PKG_VERSION=$(jq -r '.version' package.json)
            TAG_NAME="v${PKG_VERSION}"
            echo "Auto-resolved tag from package.json: $TAG_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::❌ Invalid tag format: '$TAG_NAME'. Must conform to SemVer (e.g. v4.7.14 or v4.7.14-beta.1)!"
            exit 1
          fi

          # 2. 识别是否为预发布标签 (包含 '-')
          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
            RELEASE_TYPE="prerelease"
            echo "📋 Release category: Pre-release ($TAG_NAME)"
          else
            IS_PRERELEASE="false"
            RELEASE_TYPE="stable"
            echo "📋 Release category: Stable Release ($TAG_NAME)"
          fi

          # 3. 检查当前 commit 属于哪些远程分支
          CURRENT_COMMIT="${{ github.sha }}"
          BRANCHES=$(git branch -r --contains "$CURRENT_COMMIT" | sed 's/^[[:space:]]*origin\///' | tr '\n' ' ')
          echo "Commit $CURRENT_COMMIT belongs to remote branches: [ $BRANCHES ]"

          DISPATCH_BRANCH="${{ github.ref_name }}"

          # 4. 严格通道隔离门禁 (Main 纯净正式版 / Beta 专属预发布版)
          if [ "$IS_PRERELEASE" = "true" ]; then
            # 预发布版本只允许在 beta 分支发布，严禁在 main 分支单独发布！
            if echo "$BRANCHES" | grep -qw "beta" || [ "$DISPATCH_BRANCH" = "beta" ]; then
              echo "✅ Pre-release verification passed: target is linked to 'beta' branch."
            else
              echo "::error::❌ [Release Gate Intercept] Pre-release tag '$TAG_NAME' (containing '-') is strictly forbidden on 'main' branch! Pre-releases must be published from the 'beta' branch to keep 'main' purely stable."
              exit 1
            fi
          else
            # 正式版必须在 main 分支发布，严禁直接在 beta 分支发布正式版！
            if echo "$BRANCHES" | grep -qw "main" || [ "$DISPATCH_BRANCH" = "main" ]; then
              echo "✅ Stable release verification passed: target is linked to 'main' branch."
            else
              echo "::error::❌ [Release Gate Intercept] Stable release tag '$TAG_NAME' (without '-') must be published from the 'main' branch! Please merge 'beta' into 'main' first."
              exit 1
            fi
          fi

          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: verify-release-target
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-2025"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater artifacts without signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "Updater signing key is configured; keeping updater artifacts enabled."
            exit 0
          }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "No updater signing key configured; disabled updater artifacts for this build."

      # 预发布版本降级为仅 NSIS：WiX (MSI) 要求版本号预发布段为纯数字 (≤65535)，
      # 无法打包 SemVer 预发布串 (如 4.7.14-beta)；NSIS 无此限制。正式版保持默认 bundle 不变。
      - name: Skip MSI for prerelease tags
        if: needs.verify-release-target.outputs.is_prerelease == 'true'
        shell: pwsh
        run: |
          Write-Host "Prerelease version detected; MSI (WiX) cannot bundle SemVer prerelease versions. Falling back to NSIS only."
          "PRE_BUNDLE_ARGS=--bundles nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }} ${{ env.PRE_BUNDLE_ARGS }}

      # 1. 上传 updater.json 到 Artifacts (供后续合并使用)
      - name: Upload updater json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-json-${{ matrix.platform }}-${{ strategy.job-index }}
          path: src-tauri/target/**/release/bundle/updater/*.json
          if-no-files-found: ignore

      # 2. 上传安装包到 Artifacts (供后续统一发布任务下载)
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.sig
            src-tauri/target/**/release/bundle/nsis/*.sig
          if-no-files-found: warn

  publish-release:
    needs: [verify-release-target, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 下载所有构建产物 (仅限 release 相关的 assets 和 updater)
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        env:
          VERSION: ${{ needs.verify-release-target.outputs.release_tag }}
        run: |
          echo "Extracting release notes for version $VERSION"
          awk -v ver="$VERSION" '
            BEGIN { capture = 0; needle = "**" ver }
            {
              if (capture && $0 ~ /^[[:space:]]*[*+-][[:space:]]+\*\*v/) exit
              if (!capture && $0 ~ /^[[:space:]]*[*+-][[:space:]]+\*\*/) {
                title = $0
                sub(/^[[:space:]]*[*+-][[:space:]]+/, "", title)
                if (index(title, needle) == 1) {
                  sep = substr(title, length(needle) + 1, 1)
                  if (sep == " " || sep == "\t") { capture = 1; next }
                }
              }
            }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See the assets to download this version and install." > release_notes.md
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ needs.verify-release-target.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          # Helper: read signature content from .sig file in artifacts
          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")

          echo "Signatures found:"
          [ -n "$WINDOWS_NSIS_SIG" ] && echo "  Windows x64: YES" || echo "  Windows x64: NO"

          # Build updater.json with Windows download URL and signature
          jq -n \
            --arg version "$VER" \
            --arg notes "See release page for details" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
            --arg ver "$VER" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  url: "\($dl)/Antigravity.Tools_\($ver)_x64-setup.exe",
                  signature: $win_nsis_sig
                }
              }
            }' > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done
          find release-files -maxdepth 1 -type f -print

      # 使用 ncipollo/release-action 进行统一发布，支持稳健覆盖
      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.verify-release-target.outputs.release_tag }}
          name: "Antigravity Tools ${{ needs.verify-release-target.outputs.release_tag }}"
          bodyFile: "release_notes.md"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          prerelease: ${{ needs.verify-release-target.outputs.is_prerelease == 'true' }}
          makeLatest: ${{ needs.verify-release-target.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}
