name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, beta]
  pull_request:
    branches: [main, master, beta]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端构建检查
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Security dependency regressions
        run: npm run test:security-dependencies

      - name: Build frontend
        run: npm run build

      - name: Tailwind CSS regressions
        run: npm run test:tailwind-regressions

  # Rust 代码检查
  check-rust:
    name: Check Rust Code
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Ensure frontend dist directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (-not (Test-Path "dist/index.html")) { Set-Content -Path "dist/index.html" -Value "<html/>" }

      - name: Check Rust formatting
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Run Clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features

      - name: Check Rust compilation
        run: |
          cd src-tauri
          cargo check

      - name: Test strict tool-schema depth rejection
        run: |
          cd src-tauri
          cargo test --locked --lib tool_schema

      - name: Test internal warmup loopback guard
        run: |
          cd src-tauri
          cargo test --locked --lib proxy::middleware::internal::tests

      - name: Test Gemini inert protocol padding defense (Windows loader diagnostics)
        shell: pwsh
        run: |
          Push-Location src-tauri
          $artifactMessages = Join-Path $env:RUNNER_TEMP 'gemini-defense-test-artifacts.jsonl'
          cargo test --locked --lib proxy::mappers::common_utils::defense_tests --no-run --message-format=json 1> $artifactMessages
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Pop-Location
            exit $buildExit
          }

          $testArtifacts = @(
            Get-Content -LiteralPath $artifactMessages |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'antigravity_tools_lib' -and $_.target.kind -contains 'rlib' }
          )
          $testExecutable = $null
          if ($testArtifacts.Count -eq 1) {
            $testExecutable = $testArtifacts[0].executable
          } else {
            Write-Warning "PE audit unavailable: expected exactly one focused rlib-test executable, found $($testArtifacts.Count)."
          }

          cargo test --locked --lib proxy::mappers::common_utils::defense_tests
          $testExit = $LASTEXITCODE
          Pop-Location

          if ($testExit -ne 0) {
            $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'windows-loader-pe-audit'
            try {
              if ($testExecutable) {
                & .\tools\diagnose_windows_loader.ps1 -TestExecutable $testExecutable -OutputDirectory $diagnosticDirectory
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Windows loader diagnostic unexpectedly returned exit code $LASTEXITCODE; preserving cargo test failure."
                }
              } else {
                Write-Warning 'Windows loader PE audit skipped because no unambiguous test executable was produced; preserving cargo test failure.'
              }
            } catch {
              Write-Warning "Windows loader diagnostic invocation failed: $($_.Exception.Message); preserving cargo test failure."
            } finally {
              Write-Host "Windows focused cargo test exit preserved: $testExit"
            }
          }

          exit $testExit

      - name: Upload Windows loader PE audit
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-loader-pe-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-loader-pe-audit/windows-loader-pe-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Test Windows shortcut COM interfaces
        run: |
          cd src-tauri
          cargo test --test windows_shortcut

      - name: Test password encryption
        run: |
          cd src-tauri
          cargo test --test password_crypto

      - name: Test custom database import boundary
        run: |
          cd src-tauri
          cargo test --test custom_db_import_path

  # Tauri 构建测试（不打包）
  build-tauri:
    name: Build Tauri App
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Node.js setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater artifacts in unsigned CI builds
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "Disabled updater artifacts for unsigned CI build."

      - name: Build Tauri app (debug)
        run: npm run tauri build -- --debug --no-bundle
        env:
          # CI 环境不需要签名
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
